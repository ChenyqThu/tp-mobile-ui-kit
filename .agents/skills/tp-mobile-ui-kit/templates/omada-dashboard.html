<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omada APP v5.3–6.3 Dashboard Template</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@chenyqthu/tp-mobile-ui-kit@latest/dist/style.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@chenyqthu/tp-mobile-ui-kit@latest/dist/standalone.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body style="margin: 0;">
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = TPMobileUI.React;
      const {
        TPThemeProvider,
        TPToastProvider,
        TPButton,
        TPTag,
        TPIcon,
        OmadaAppDemo,
        useTPTheme,
        useTPToast,
      } = window.TPMobileUI;

      const SCREEN_SHORTCUTS = [
        { key: 'dashboard', label: 'Dashboard' },
        { key: 'controllers', label: 'Controllers' },
        { key: 'devices', label: 'Devices' },
        { key: 'clients', label: 'Clients' },
        { key: 'insights', label: 'Insights' },
        { key: 'settings', label: 'Settings' },
        { key: 'launch', label: 'Launch' },
      ];

      function OmadaDashboardStage() {
        const [screen, setScreen] = useState('dashboard');
        const [device, setDevice] = useState('iphone16pro');
        const { resolvedMode, setMode, setOS, tokens } = useTPTheme();
        const toast = useTPToast();

        const toggleTheme = () => {
          const next = resolvedMode === 'dark' ? 'light' : 'dark';
          setMode(next);
          toast.show({ type: 'info', message: `Switched to ${next} mode` });
        };

        const toggleDevice = () => {
          const nextDevice = device === 'iphone16pro' ? 'android' : 'iphone16pro';
          setDevice(nextDevice);
          setOS(nextDevice === 'android' ? 'android' : 'ios');
        };

        return (
          <div
            style={{
              minHeight: '100vh',
              background: tokens.background,
              color: tokens.textPrimary,
              padding: '20px 16px 36px',
              boxSizing: 'border-box',
              display: 'flex',
              flexDirection: 'column',
              alignItems: 'center',
              gap: 16,
            }}
          >
            <div
              style={{
                width: '100%',
                maxWidth: 760,
                display: 'flex',
                flexWrap: 'wrap',
                alignItems: 'center',
                justifyContent: 'space-between',
                gap: 10,
                padding: '12px 16px',
                borderRadius: 14,
                background: tokens.card,
                border: `1px solid ${tokens.listDivider}`,
              }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <TPIcon name="platform-omada" size={24} />
                <div>
                  <div style={{ fontWeight: 600, fontSize: 15 }}>Omada APP Mobile Prototype</div>
                  <div style={{ fontSize: 12, color: tokens.textSecondary }}>
                    Tap tabs, Topology, Site Health, or Toolkit FAB inside the phone
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                <TPButton variant="secondary" size="sm" onClick={toggleDevice}>
                  {device === 'iphone16pro' ? 'iPhone 16 Pro' : 'Android'}
                </TPButton>
                <TPButton variant="primary" size="sm" onClick={toggleTheme}>
                  {resolvedMode === 'dark' ? 'Light Mode' : 'Dark Mode'}
                </TPButton>
              </div>
            </div>

            <div style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', gap: 6 }}>
              {SCREEN_SHORTCUTS.map((item) => (
                <TPTag
                  key={item.key}
                  selected={screen === item.key}
                  onClick={() => setScreen(item.key)}
                >
                  {item.label}
                </TPTag>
              ))}
            </div>

            <OmadaAppDemo
              screen={screen}
              onScreenChange={setScreen}
              device={device}
              showFrame
            />
          </div>
        );
      }

      TPMobileUI.render(
        <TPThemeProvider defaultBrand="omada" defaultMode="light" defaultOS="ios">
          <TPToastProvider>
            <OmadaDashboardStage />
          </TPToastProvider>
        </TPThemeProvider>,
        '#root',
      );
    </script>
  </body>
</html>
